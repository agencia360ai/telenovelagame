let game = load() || seed();
let tab="plot";          // "plot" | "daily"
let selChap=null;        // reference to chapter object
let selBeat=null;        // beat id

function save(){ localStorage.setItem(LS, JSON.stringify(game)); document.getElementById("saved").textContent="Guardado "+new Date().toLocaleTimeString(); }
function load(){ try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null;}catch(e){return null;} }
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function charIds(){ return Object.keys(game.characters); }
function beatIds(){ return selChap?selChap.beats.map(b=>b.id):[]; }

// ---- ordering helpers ----
function arrMove(arr,from,to){ if(from<0||from>=arr.length||to<0||to>=arr.length||from===to)return; const [x]=arr.splice(from,1); arr.splice(to,0,x); }
function callWeek(c){ return (c.week!=null)?c.week : ((c.tags&&c.tags.week_min)||1); }
// stable sort of the flat pool by week so the file stays organized by week
function sortLibraryByWeek(){ const lib=game.daily_calls.library||[]; lib.sort((a,b)=>callWeek(a)-callWeek(b)); }
// reorder a call relative to its same-week neighbours (dir: -1 up, +1 down)
function moveCallInWeek(c,dir){
  const lib=game.daily_calls.library; const wk=callWeek(c);
  const idxs=lib.map((x,i)=>[x,i]).filter(p=>callWeek(p[0])===wk);
  const pos=idxs.findIndex(p=>p[0]===c); const tgt=pos+dir;
  if(tgt<0||tgt>=idxs.length)return;
  const gi=idxs[pos][1], gj=idxs[tgt][1];
  const tmp=lib[gi]; lib[gi]=lib[gj]; lib[gj]=tmp;
  render();
}
function setCallWeek(c,w){ c.week=+w; sortLibraryByWeek(); render(); }

// generic HTML5 drag-and-drop reorder over a container of .item rows.
// onDrop(fromIndex,toIndex) mutates the data; we re-render afterwards.
function attachDnD(container, onDrop){
  let dragFrom=-1;
  [...container.children].forEach((el,i)=>{
    if(!el.classList.contains("item"))return;
    el.setAttribute("draggable","true");
    el.dataset.idx=i;
    el.addEventListener("dragstart",e=>{dragFrom=+el.dataset.idx;el.classList.add("drag");e.dataTransfer.effectAllowed="move";});
    el.addEventListener("dragend",()=>{el.classList.remove("drag");[...container.children].forEach(c=>c.classList&&c.classList.remove("over"));});
    el.addEventListener("dragover",e=>{e.preventDefault();if(+el.dataset.idx!==dragFrom)el.classList.add("over");});
    el.addEventListener("dragleave",()=>el.classList.remove("over"));
    el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("over");const to=+el.dataset.idx;if(dragFrom>=0&&to>=0&&dragFrom!==to){onDrop(dragFrom,to);render();}});
  });
}

function setTab(t){ tab=t; selChap=null; selBeat=null;
  document.getElementById("tabPlot").classList.toggle("on",t==="plot");
  document.getElementById("tabDaily").classList.toggle("on",t==="daily");
  render(); }
document.getElementById("tabPlot").onclick=()=>setTab("plot");
document.getElementById("tabDaily").onclick=()=>setTab("daily");

function render(){ renderNav(); renderBeats(); renderEditor(); document.getElementById("ctx").textContent = tab==="plot"?"Arco principal · 2 beats/semana":"Pool de llamadas · arrastra o ▲▼ para ordenar"; save(); }

function chapItem(ch, label){
  const d=document.createElement("div"); d.className="item"+(ch===selChap?" sel":"");
  d.innerHTML=`${esc(ch.title||ch.id)}<span class="kind ${ch.kind||""}">${(ch.kind||"").replace("_"," ")}</span>
    <div class="meta">${esc(ch.id)} · ${ch.beats?ch.beats.length:0} beats</div>${ch.synopsis?`<div class="syn">${esc(ch.synopsis)}</div>`:""}`;
  d.onclick=()=>{ selChap=ch; selBeat=ch.start_beat||(ch.beats[0]&&ch.beats[0].id)||null; render(); };
  return d;
}

function renderNav(){
  const el=document.getElementById("nav"); el.innerHTML="";
  if(tab==="plot"){
    el.innerHTML=`<h2>Game Plot</h2>`;
    const gp=game.game_plot;
    if(gp.prologue){ const w=document.createElement("div"); w.className="wk"; w.innerHTML=`<div class="wkhd">Prólogo</div>`; w.appendChild(chapItem(gp.prologue)); el.appendChild(w); }
    (gp.weeks||[]).forEach(wk=>{
      const w=document.createElement("div"); w.className="wk";
      w.innerHTML=`<div class="wkhd">Semana ${wk.week}${wk.goal_trust!=null?` · meta confianza ${wk.goal_trust}`:""}</div>`;
      if(wk.plot_call) w.appendChild(chapItem(wk.plot_call));
      if(wk.weekend) w.appendChild(chapItem(wk.weekend));
      el.appendChild(w);
    });
  } else {
    const lib=game.daily_calls.library||[];
    el.innerHTML=`<h2>Daily Calls · ${lib.length} en el pool</h2>`;
    const weeks=[...new Set(lib.map(callWeek))].sort((a,b)=>a-b);
    weeks.forEach(wk=>{
      const calls=lib.filter(c=>callWeek(c)===wk);
      const grp=document.createElement("div"); grp.className="wk";
      grp.innerHTML=`<div class="wkhd">Semana ${wk} <span class="ct">· ${calls.length} llamada${calls.length!==1?"s":""}</span></div>`;
      const listHost=document.createElement("div"); grp.appendChild(listHost);
      calls.forEach((c)=>{
        const d=document.createElement("div"); d.className="item"+(c===selChap?" sel":"");
        const t=c.tags||{};
        d.innerHTML=`<span class="grip" title="Arrastra para reordenar">⠿</span> ${esc(c.title||c.id)}
          <span class="kind ${c.kind||"daily_call"}">${(c.kind||"daily call").replace("_"," ")}</span>
          <div class="meta">${esc(c.id)} · ${c.beats?c.beats.length:0} beats</div>
          <div style="font-size:10px;color:var(--choice);margin-top:2px">dif ${t.difficulty||1} · ${t.type||"?"} · ${t.unit||"none"}${t.category?(" · "+t.category):""}</div>
          <div class="rowbtns">
            <button class="ord up" title="Subir">▲</button>
            <button class="ord down" title="Bajar">▼</button>
            <select class="wksel" title="Mover a semana">${Array.from({length:MAX_WEEK},(_,k)=>k+1).map(n=>`<option value="${n}" ${n===wk?"selected":""}>S${n}</option>`).join("")}</select>
          </div>`;
        d.onclick=e=>{ if(e.target.closest(".ord")||e.target.closest(".wksel"))return; selChap=c; selBeat=c.start_beat||(c.beats[0]&&c.beats[0].id)||null; render(); };
        d.querySelector(".up").onclick=e=>{e.stopPropagation();moveCallInWeek(c,-1);};
        d.querySelector(".down").onclick=e=>{e.stopPropagation();moveCallInWeek(c,1);};
        d.querySelector(".wksel").onchange=e=>{e.stopPropagation();setCallWeek(c,e.target.value);};
        listHost.appendChild(d);
      });
      // drag within this week's list
      attachDnD(listHost,(from,to)=>{
        const lib=game.daily_calls.library; const idxs=lib.map((x,i)=>[x,i]).filter(p=>callWeek(p[0])===wk).map(p=>p[1]);
        arrMove(lib, idxs[from], idxs[to]);
      });
      el.appendChild(grp);
    });
    const add=document.createElement("button"); add.className="mini"; add.textContent="+ Llamada"; add.style.marginTop="10px";
    add.onclick=()=>{ const id="call_"+(lib.length+1); const ch={id,title:"Nueva llamada",kind:"daily_call",week:1,start_beat:id+".intro",tags:{week_min:1,difficulty:1,type:"real",unit:"none",category:"misc"},beats:[{id:id+".intro",background:"bg_dispatch",type:"dialogue",characters_on_scene:[],lines:[{speaker:"narrator",expr:"neutral",text:""}],next:null}]}; lib.push(ch); sortLibraryByWeek(); selChap=ch; selBeat=ch.start_beat; render(); };
    el.appendChild(add);
  }
}

function renderBeats(){
  const el=document.getElementById("beats");
  if(!selChap){ el.innerHTML=`<h2>Beats</h2><div class="empty" style="margin-top:20px">Elige un capítulo</div>`; return; }
  el.innerHTML=`<h2>Beats · ${esc(selChap.title||selChap.id)}</h2>`;
  // tags editor for daily calls
  if(tab==="daily" && selChap.tags){
    const t=selChap.tags;
    const card=document.createElement("div"); card.className="card";
    card.innerHTML=`<div class="sub">Tags del pool</div>
      <div class="row"><div><label>semana (posición)</label><select id="t_wkpos">${Array.from({length:MAX_WEEK},(_,k)=>k+1).map(n=>`<option value="${n}" ${n===callWeek(selChap)?"selected":""}>Semana ${n}</option>`).join("")}</select></div>
      <div><label>dificultad</label><input id="t_df" type="number" min="1" max="3" value="${t.difficulty||1}"></div></div>
      <div class="row"><div><label>week_min</label><input id="t_wk" type="number" min="1" value="${t.week_min||1}"></div>
      <div><label>tipo</label><select id="t_ty">${CTYPES.map(x=>`<option ${x===t.type?"selected":""}>${x}</option>`).join("")}</select></div></div>
      <div class="row"><div><label>unidad</label><select id="t_un">${UNITS.map(x=>`<option ${x===t.unit?"selected":""}>${x}</option>`).join("")}</select></div>
      <div><label>categoría</label><input id="t_cat" list="catlist" value="${esc(t.category||"")}"><datalist id="catlist">${CATS.map(x=>`<option value="${x}">`).join("")}</datalist></div></div>`;
    el.appendChild(card);
    card.querySelector("#t_wkpos").onchange=e=>{setCallWeek(selChap,e.target.value);};
    card.querySelector("#t_wk").oninput=e=>{t.week_min=+e.target.value;renderNav();save();};
    card.querySelector("#t_df").oninput=e=>{t.difficulty=+e.target.value;renderNav();save();};
    card.querySelector("#t_ty").onchange=e=>{t.type=e.target.value;renderNav();save();};
    card.querySelector("#t_un").onchange=e=>{t.unit=e.target.value;renderNav();save();};
    card.querySelector("#t_cat").oninput=e=>{const v=e.target.value.trim();if(v)t.category=v;else delete t.category;renderNav();save();};
  }
  // Call-level clips (intro / ambient / deploy) — what the game actually shows.
  if(tab==="daily"){
    selChap.media = selChap.media || {};
    const m=selChap.media;
    const mc=document.createElement("div"); mc.className="card";
    mc.innerHTML=`<div class="sub">Clips de la llamada</div>
      <div class="hint">Pega una URL directa (Dropbox <code>?dl=1</code>, Supabase…) o una key registrada en el juego.</div>
      <label>Intro · cutscene (video)</label><input id="m_in" placeholder="https://…mp4?dl=1" value="${esc(m.intro||"")}">
      <label>Ambiente · fondo del chat (video)</label><input id="m_amb" placeholder="https://…mp4?dl=1" value="${esc(m.ambient||"")}">
      <label>Deploy · al despachar (video)</label><input id="m_dep" placeholder="https://…mp4?dl=1" value="${esc(m.deploy||"")}">`;
    el.appendChild(mc);
    const setM=(k,v)=>{ v=(v||"").trim(); if(v)m[k]=v; else delete m[k]; if(!Object.keys(m).length)delete selChap.media; save(); };
    mc.querySelector("#m_in").oninput=e=>setM("intro",e.target.value);
    mc.querySelector("#m_amb").oninput=e=>setM("ambient",e.target.value);
    mc.querySelector("#m_dep").oninput=e=>setM("deploy",e.target.value);
  }
  const listHost=document.createElement("div"); el.appendChild(listHost);
  selChap.beats.forEach((b,bi)=>{
    const isStart=selChap.start_beat===b.id;
    const d=document.createElement("div"); d.className="item"+(b.id===selBeat?" sel":"");
    const preview=(b.lines&&b.lines[0]&&b.lines[0].text)||(b.decision&&b.decision.prompt)||"";
    d.innerHTML=`<div><span class="grip" title="Arrastra para reordenar">⠿</span> ${isStart?"▶ ":""}<span class="badge ${b.type}">${b.type}</span></div>
      <div class="meta">${esc(b.id)}</div>
      <div style="font-size:11px;margin-top:3px;color:#c7cee0">${esc(preview.slice(0,44))}</div>
      <div class="rowbtns"><button class="ord up" title="Subir">▲</button><button class="ord down" title="Bajar">▼</button></div>`;
    d.onclick=e=>{ if(e.target.closest(".ord"))return; selBeat=b.id; renderEditor(); [...listHost.querySelectorAll(".item")].forEach(x=>x.classList.remove("sel")); d.classList.add("sel"); };
    d.querySelector(".up").onclick=e=>{e.stopPropagation();arrMove(selChap.beats,bi,bi-1);render();};
    d.querySelector(".down").onclick=e=>{e.stopPropagation();arrMove(selChap.beats,bi,bi+1);render();};
    listHost.appendChild(d);
  });
  attachDnD(listHost,(from,to)=>arrMove(selChap.beats,from,to));
  const add=document.createElement("button"); add.className="mini"; add.textContent="+ Beat"; add.style.marginTop="6px";
  add.onclick=()=>{ const id=uniqueBeatId(); selChap.beats.push({id,background:(selChap.beats[0]&&selChap.beats[0].background)||"bg_dispatch",type:"dialogue",characters_on_scene:[],lines:[{speaker:charIds()[0]||"narrator",expr:"neutral",text:""}],next:null}); selBeat=id; render(); };
  el.appendChild(add);
}
function uniqueBeatId(){ let i=1; const base=selChap.id+".n"; while(selChap.beats.find(b=>b.id===base+i))i++; return base+i; }

function beatSelect(val){ return `<select data-bind="next"><option value="">(fin / null)</option>${beatIds().map(id=>`<option ${id===val?"selected":""}>${id}</option>`).join("")}</select>`; }
function cnextSelect(val){ return `<select data-bind="cnext"><option value="">(fin)</option>${beatIds().map(id=>`<option ${id===val?"selected":""}>${id}</option>`).join("")}</select>`; }
function speakerSelect(val){ return `<select class="spk">${charIds().map(id=>`<option value="${id}" ${id===val?"selected":""}>${esc(game.characters[id].name)} (${id})</option>`).join("")}</select>`; }
function exprSelect(val){ return `<select class="expr">${EXPRS.map(e=>`<option ${e===val?"selected":""}>${e}</option>`).join("")}</select>`; }
function beat(id){ return selChap.beats.find(b=>b.id===id); }

function renderEditor(){
  const ed=document.getElementById("editor");
  if(!selChap){ ed.innerHTML=`<div class="empty">Selecciona un capítulo.</div>`; return; }
  if(!selBeat||!beat(selBeat)){ ed.innerHTML=chapHeader()+`<div class="empty">Selecciona un beat.</div>`; bindChapHeader(); return; }
  const b=beat(selBeat);
  let h=chapHeader()+`<h2>Beat · ${esc(b.id)}</h2>
    <div class="row"><div><label>ID</label><input id="b_id" value="${esc(b.id)}"></div>
    <div><label>Tipo</label><select id="b_type">${TYPES.map(t=>`<option ${t===b.type?"selected":""}>${t}</option>`).join("")}</select></div></div>
    <div class="row"><div><label>Background</label><input id="b_bg" value="${esc(b.background||"")}"></div>
    <div><label>Media (opcional)</label><select id="b_mt"><option value="">(ninguno · usa background)</option><option value="image" ${b.media&&b.media.type==="image"?"selected":""}>image</option><option value="video" ${b.media&&b.media.type==="video"?"selected":""}>video</option></select></div></div>
    <div id="mkrow">${b.media?`<label>Media key</label><input id="b_mk" value="${esc(b.media.key||"")}">`:""}</div>
    <button class="mini" id="b_setstart" style="margin-top:6px">▶ Marcar como inicio</button>
    <div class="sub" style="margin-top:12px">Líneas</div><div id="lines"></div><button class="mini" id="addLine">+ Línea</button>`;
  if(b.type==="decision"){ h+=`<div class="sub">Decisión</div><label>Prompt</label><input id="d_prompt" value="${esc(b.decision&&b.decision.prompt||"")}"><div id="choices"></div><button class="mini" id="addChoice">+ Opción</button>`; }
  else { h+=`<label style="margin-top:12px">Siguiente →</label>${beatSelect(b.next||"")}`; if(b.type==="chapter_end"||b.type==="cliffhanger"){ h+=`<label>Outcome</label><input id="b_out" value="${esc(b.outcome||"")}">`; } }
  h+=`<details><summary>Efectos del beat</summary><div id="beatEff"></div><button class="mini" id="addBeatEff">+ Efecto</button></details>
    <div style="margin-top:14px"><button class="mini danger" id="delBeat">Borrar beat</button></div>`;
  ed.innerHTML=h; bindChapHeader();

  ed.querySelector("#b_id").onchange=e=>renameBeat(b,e.target.value.trim());
  ed.querySelector("#b_type").onchange=e=>{ b.type=e.target.value; if(b.type==="decision"&&!b.decision){b.decision={prompt:"What do you do?",choices:[]};delete b.next;} if(b.type!=="decision"&&b.decision){delete b.decision;if(b.next===undefined)b.next=null;} renderEditor(); };
  ed.querySelector("#b_bg").oninput=e=>{b.background=e.target.value;save();};
  ed.querySelector("#b_mt").onchange=e=>{ if(!e.target.value){delete b.media;} else {b.media=b.media||{key:""};b.media.type=e.target.value;} renderEditor(); };
  const mk=ed.querySelector("#b_mk"); if(mk)mk.oninput=e=>{b.media.key=e.target.value;save();};
  ed.querySelector("#b_setstart").onclick=()=>{selChap.start_beat=b.id;renderBeats();save();};
  ed.querySelector("#delBeat").onclick=()=>{ if(confirm("¿Borrar beat?")){selChap.beats=selChap.beats.filter(x=>x.id!==b.id);selBeat=null;render();} };

  renderLines(b);
  ed.querySelector("#addLine").onclick=()=>{ b.lines=b.lines||[]; b.lines.push({speaker:charIds()[0]||"narrator",expr:"neutral",text:""}); renderLines(b); syncOnScene(b); save(); };
  if(b.type==="decision"){ ed.querySelector("#d_prompt").oninput=e=>{b.decision.prompt=e.target.value;save();}; renderChoices(b);
    ed.querySelector("#addChoice").onclick=()=>{b.decision.choices.push({id:b.id+"_"+b.decision.choices.length,label:"Nueva opción",gem_cost:0,next:null});renderChoices(b);save();}; }
  else { const ns=ed.querySelector('[data-bind="next"]'); if(ns)ns.onchange=e=>{b.next=e.target.value||null;renderBeats();save();}; const bo=ed.querySelector("#b_out"); if(bo)bo.oninput=e=>{b.outcome=e.target.value;save();}; }
  renderEff(ed.querySelector("#beatEff"), b); ed.querySelector("#addBeatEff").onclick=()=>{b.effects=b.effects||{};b.effects["var"]=1;renderEff(ed.querySelector("#beatEff"),b);save();};
}

function chapHeader(){
  return `<h2>Capítulo</h2><div class="row"><div><label>Título</label><input id="c_title" value="${esc(selChap.title||"")}"></div>
    <div style="flex:none;width:120px"><label>ID</label><input id="c_id" value="${esc(selChap.id)}"></div></div>
    ${selChap.synopsis!==undefined?`<label>Sinopsis</label><textarea id="c_syn">${esc(selChap.synopsis||"")}</textarea>`:""}<hr style="border-color:var(--line);margin:12px 0">`;
}
function bindChapHeader(){
  const t=document.getElementById("c_title"); if(t)t.oninput=e=>{selChap.title=e.target.value;renderNav();save();};
  const s=document.getElementById("c_syn"); if(s)s.oninput=e=>{selChap.synopsis=e.target.value;renderNav();save();};
  const id=document.getElementById("c_id"); if(id)id.onchange=e=>{selChap.id=e.target.value.trim();renderNav();save();};
}

function renderLines(b){
  const wrap=document.getElementById("lines"); wrap.innerHTML="";
  (b.lines||[]).forEach((ln,i)=>{
    const row=document.createElement("div"); row.className="line-row";
    row.innerHTML=`${speakerSelect(ln.speaker)}${exprSelect(ln.expr)}<textarea>${esc(ln.text||"")}</textarea><button class="mini danger">✕</button>`;
    row.querySelector(".spk").onchange=e=>{ln.speaker=e.target.value;syncOnScene(b);save();};
    row.querySelector(".expr").onchange=e=>{ln.expr=e.target.value;save();};
    row.querySelector("textarea").oninput=e=>{ln.text=e.target.value;save();renderBeats();};
    row.querySelector("button").onclick=()=>{b.lines.splice(i,1);renderLines(b);syncOnScene(b);save();};
    wrap.appendChild(row);
  });
}
function syncOnScene(b){ const s=[]; (b.lines||[]).forEach(l=>{if(l.speaker!=="narrator"&&!s.includes(l.speaker))s.push(l.speaker);}); b.characters_on_scene=s; }

function renderChoices(b){
  const wrap=document.getElementById("choices"); wrap.innerHTML="";
  b.decision.choices.forEach((c,i)=>{
    const card=document.createElement("div"); card.className="card";
    card.innerHTML=`<div class="row"><b style="color:var(--choice);font-size:11px">Opción ${i+1}</b>
      <div style="flex:none;display:flex;gap:4px"><button class="ord cup" title="Subir">▲</button><button class="ord cdown" title="Bajar">▼</button><button class="mini danger cdel">✕</button></div></div>
      <label>Texto</label><input class="c_label" value="${esc(c.label||"")}">
      <div class="row"><div><label>Lleva a →</label>${cnextSelect(c.next||"")}</div><div style="flex:none;width:80px"><label>Gemas</label><input class="c_gem" type="number" min="0" value="${c.gem_cost||0}"></div></div>
      <label class="chk"><input type="checkbox" class="c_prem" ${c.premium?"checked":""}> premium</label>
      <div class="sub">Efectos</div><div class="c_eff"></div><button class="mini c_addeff">+ Efecto</button>`;
    card.querySelector(".c_label").oninput=e=>{c.label=e.target.value;save();};
    card.querySelector('[data-bind="cnext"]').onchange=e=>{c.next=e.target.value||null;save();};
    card.querySelector(".c_gem").oninput=e=>{c.gem_cost=+e.target.value;save();};
    card.querySelector(".c_prem").onchange=e=>{if(e.target.checked)c.premium=true;else delete c.premium;save();};
    card.querySelector(".cup").onclick=()=>{arrMove(b.decision.choices,i,i-1);renderChoices(b);save();};
    card.querySelector(".cdown").onclick=()=>{arrMove(b.decision.choices,i,i+1);renderChoices(b);save();};
    card.querySelector(".cdel").onclick=()=>{b.decision.choices.splice(i,1);renderChoices(b);save();};
    renderEff(card.querySelector(".c_eff"),c);
    card.querySelector(".c_addeff").onclick=()=>{c.effects=c.effects||{};c.effects["var"]=1;renderEff(card.querySelector(".c_eff"),c);save();};
    wrap.appendChild(card);
  });
}
function renderEff(host,obj){
  host.innerHTML=""; const eff=obj.effects||{};
  Object.entries(eff).forEach(([k,v])=>{
    const row=document.createElement("div"); row.className="eff";
    row.innerHTML=`<input class="ek" value="${esc(k)}" placeholder="variable"><input class="ev" type="number" value="${v}" style="width:70px;flex:none"><button class="mini danger" style="flex:none">✕</button>`;
    const ek=row.querySelector(".ek"),ev=row.querySelector(".ev");
    ek.onchange=()=>{const nv=eff[k];delete eff[k];eff[ek.value]=nv;obj.effects=eff;save();};
    ev.oninput=()=>{eff[ek.value||k]=+ev.value;obj.effects=eff;save();};
    row.querySelector("button").onclick=()=>{delete eff[ek.value||k];if(Object.keys(eff).length===0)delete obj.effects;renderEff(host,obj);save();};
    host.appendChild(row);
  });
}
function renameBeat(b,nid){
  if(!nid||nid===b.id)return;
  if(selChap.beats.find(x=>x.id===nid)){alert("ID duplicado.");renderEditor();return;}
  const old=b.id;
  selChap.beats.forEach(x=>{if(x.next===old)x.next=nid;(x.decision&&x.decision.choices||[]).forEach(c=>{if(c.next===old)c.next=nid;});});
  if(selChap.start_beat===old)selChap.start_beat=nid;
  b.id=nid;selBeat=nid;render();
}

// export / import
function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
document.getElementById("exp").onclick=()=>{ sortLibraryByWeek(); download("dispatcher-game.json", JSON.stringify(game,null,2), "application/json"); };
document.getElementById("imp").onclick=()=>document.getElementById("impFile").click();
document.getElementById("impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{ let parsed=JSON.parse(r.result);
    if(Array.isArray(parsed)) parsed={daily_calls:{serve_per_day:3,library:parsed}};
    game=parsed;
    if(!game.game_plot)game.game_plot={prologue:null,weeks:[]}; if(!game.daily_calls)game.daily_calls={serve_per_day:3,library:[]};
    const hasDaily=(game.daily_calls.library||[]).length>0;
    setTab(hasDaily?"daily":"plot"); alert("Importado: "+(game.daily_calls.library||[]).length+" daily calls."); }catch(err){alert("JSON inválido: "+err.message);}};
  r.readAsText(f);};

document.getElementById("loadBundled").onclick=()=>{ if(confirm("Esto reemplaza el contenido actual del editor con las 16 daily calls de ejemplo. ¿Continuar?")){ game=JSON.parse(JSON.stringify(BUNDLED_GAME)); setTab("daily"); } };
render();
</script>
</body>
